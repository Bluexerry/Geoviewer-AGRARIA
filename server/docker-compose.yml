version: '3.8'
services:
  auth-service:
    build: ./auth_service
    env_file: ./auth_service/.env
    ports:
      - "5001:5001"
    networks:
      - backend

  data-service:
    build: ./data_service
    env_file: ./data_service/.env
    ports:
      - "5002:5002"
    networks:
      - backend

  analysis-service:
    build: ./analysis_service
    ports:
      - "5003:5003"
    networks:
      - backend

  earth-engine-service:
    build: ./earth_engine_service
    env_file: ./earth_engine_service/.env
    ports:
      - "5004:5004"
    networks:
      - backend

  db:
    image: postgres:latest
    env_file: .env
    ports:
      - "5432:5432"

networks:
  backend: